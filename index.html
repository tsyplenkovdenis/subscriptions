<body>
    <!-- РҐРµРґРµСЂ -->

    <script>
        (function(){
            let subscriptions = JSON.parse(localStorage.getItem('subscriptions')) || [];
            let editingId = null;

            function saveToStorage() {
                localStorage.setItem('subscriptions', JSON.stringify(subscriptions));
            }

            const DAY_MS = 86400000;
            function parseDate(value) {
                if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) throw new Error('РќРµРєРѕСЂСЂРµРєС‚РЅР°СЏ РґР°С‚Р°');
                const [y,m,d] = value.split('-').map(Number);
                const date = new Date(0);
                date.setUTCHours(0,0,0,0); date.setUTCFullYear(y,m-1,d);
                if (date.getUTCFullYear() !== y || date.getUTCMonth() !== m-1 || date.getUTCDate() !== d) throw new Error('РќРµСЃСѓС‰РµСЃС‚РІСѓСЋС‰Р°СЏ РґР°С‚Р°');
                return date;
            }
            function formatDate(date) {
                return [String(date.getUTCFullYear()).padStart(4,'0'),String(date.getUTCMonth()+1).padStart(2,'0'),String(date.getUTCDate()).padStart(2,'0')].join('-');
            }
            function todayDate() {
                const d = new Date();
                return [String(d.getFullYear()).padStart(4,'0'),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
            }
            function validCount(value) {
                const n = Number(value);
                if (!Number.isSafeInteger(n) || n < 1 || n > 10000) throw new Error('РљРѕР»РёС‡РµСЃС‚РІРѕ РїРµСЂРёРѕРґРѕРІ: С†РµР»РѕРµ С‡РёСЃР»Рѕ РѕС‚ 1 РґРѕ 10000');
                return n;
            }
            function calculateNextPayment(anchor,period,count=1,cycles=1) {
                const d=parseDate(anchor), step=validCount(count)*cycles;
                if (!Number.isSafeInteger(cycles) || cycles < 0) throw new Error('РќРµРєРѕСЂСЂРµРєС‚РЅРѕРµ С‡РёСЃР»Рѕ С†РёРєР»РѕРІ');
                if (period === 'week') d.setUTCDate(d.getUTCDate()+7*step);
                else if (period === 'month' || period === 'year') {
                    const day=d.getUTCDate(); d.setUTCDate(1);
                    d.setUTCMonth(d.getUTCMonth()+step*(period === 'year' ? 12 : 1));
                    const last=new Date(d.getTime()); last.setUTCMonth(last.getUTCMonth()+1,0);
                    d.setUTCDate(Math.min(day,last.getUTCDate()));
                } else throw new Error('РќРµРёР·РІРµСЃС‚РЅС‹РёМ† РїРµСЂРёРѕРґ');
                if (!Number.isFinite(d.getTime()) || d.getUTCFullYear()>9999) throw new Error('Р”Р°С‚Р° РІРЅРµ РґРёР°РїР°Р·РѕРЅР°');
                return formatDate(d);
            }
            function daysUntil(date,today=todayDate()) {
                return Math.round((parseDate(date)-parseDate(today))/DAY_MS);
            }
            function refreshOverdueSubscriptions(today=todayDate()) {
                let changed=false;
                for (const sub of subscriptions) {
                    try {
                        parseDate(sub.nextPayment);
                        const count=validCount(sub.periodCount ?? 1);
                        if (!['week','month','year'].includes(sub.period)) throw new Error('РќРµРёР·РІРµСЃС‚РЅС‹РёМ† РїРµСЂРёРѕРґ');
                        if (!sub.renewalAnchor) { sub.renewalAnchor=sub.nextPayment; changed=true; }
                        const anchor=parseDate(sub.renewalAnchor);
                        // Р”Р°С‚Р° РїР»Р°С‚РµР¶Р° РѕСЃС‚Р°РµМ€С‚СЃСЏ РІРёРґРёРјРѕРёМ† РІРµСЃСЊ РґРµРЅСЊ; РїРµСЂРµРЅРѕСЃ РЅР° СЃР»РµРґСѓСЋС‰РёРёМ† РґРµРЅСЊ.
                        if (sub.nextPayment>=today) continue;
                        const target=parseDate(today);
                        let cycles;
                        if (sub.period==='week') cycles=Math.max(0,Math.ceil((target-anchor)/(DAY_MS*7*count)));
                        else {
                            const months=(target.getUTCFullYear()-anchor.getUTCFullYear())*12+target.getUTCMonth()-anchor.getUTCMonth();
                            cycles=Math.max(0,Math.floor(months/(count*(sub.period==='year'?12:1))));
                        }
                        let next=calculateNextPayment(sub.renewalAnchor,sub.period,count,cycles);
                        while(next<today) next=calculateNextPayment(sub.renewalAnchor,sub.period,count,++cycles);
                        if(next!==sub.nextPayment) { sub.nextPayment=next; changed=true; }
                    } catch(error) { console.error('РћС€РёР±РєР° РґР°С‚С‹',sub.name,error); }
                }
                if(changed) saveToStorage();
                return changed;
            }

            function calculateMonthlyTotal() {
                return subscriptions.reduce((total, sub) => {
                    const amount = parseFloat(sub.amount) || 0;
                    const count = sub.periodCount || 1;
                    switch (sub.period) {
                        case 'week': return total + ((amount / 7 * 30) / count);
                        case 'month': return total + (amount / count);
                        case 'year': return total + (amount / (12 * count));
                        default: return total;
                    }
                }, 0);
            }

            function updateSummary() {
                const monthly = calculateMonthlyTotal();
                const yearly = monthly * 12;
                const fmt = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
                document.getElementById('totalMonthlyAmount').textContent = fmt.format(monthly) + ' в‚Ѕ';
                document.getElementById('totalYearlyAmount').textContent = fmt.format(yearly) + ' в‚Ѕ';
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function getDaysWord(days) {
                const abs = Math.abs(days);
                if (abs % 100 >= 11 && abs % 100 <= 14) return 'РґРЅРµР№';
                if (abs % 10 === 1) return 'РґРµРЅСЊ';
                if (abs % 10 >= 2 && abs % 10 <= 4) return 'РґРЅСЏ';
                return 'РґРЅРµР№';
            }

            function renderCards() {
                refreshOverdueSubscriptions();
                const container = document.getElementById('cards');
                const today = todayDate();
                const sorted = [...subscriptions].sort((a,b) => a.nextPayment.localeCompare(b.nextPayment));
                container.innerHTML = sorted.map(sub => {
                    const days = daysUntil(sub.nextPayment,today);
                    const dateStr = parseDate(sub.nextPayment).toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric', timeZone:'UTC'});
                    const urgent = days <= 3;
                    let periodText = sub.period === 'week' ? 'РЅРµРґ' : (sub.period === 'month' ? 'РјРµСЃ' : 'РіРѕРґ');
                    const count = sub.periodCount || 1;
                    if (count > 1) periodText = count + ' ' + periodText;
                    return `
                        <div class="card" onclick="editSubscription('${sub.id}')">
                            <div class="card-title">${escapeHtml(sub.name) || 'Р‘РµР· РЅР°Р·РІР°РЅРёСЏ'}</div>
                            <div class="card-amount">${parseFloat(sub.amount).toFixed(0)} в‚Ѕ / ${periodText}</div>
                            <div class="card-date">рџ“… ${dateStr}</div>
                            <div class="card-days ${urgent ? 'urgent' : ''}">${days} ${getDaysWord(days)}</div>
                            <div class="card-buttons">
                                <button class="btn btn-edit" onclick="event.stopPropagation(); editSubscription('${sub.id}')">РР·РјРµРЅРёС‚СЊ</button>
                                <button class="btn btn-delete" onclick="event.stopPropagation(); deleteSubscription('${sub.id}')">РЈРґР°Р»РёС‚СЊ</button>
                            </div>
                        </div>
                    `;
                }).join('');
                updateSummary();
            }

            // ---------- РЈР›РЈР§РЁР•РќРќР«Р™ РРњРџРћР Рў CSV (РїРѕРґРґРµСЂР¶РєР° Excel) ----------
            function parseCSV(text) {
                // РЈР±РёСЂР°РµРј BOM
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                const lines = text.split(/\r?\n/).filter(line => line.trim());
                if (lines.length < 2) return [];
                
                // РћРїСЂРµРґРµР»СЏРµРј СЂР°Р·РґРµР»РёС‚РµР»СЊ: Р·Р°РїСЏС‚Р°СЏ РёР»Рё С‚РѕС‡РєР° СЃ Р·Р°РїСЏС‚РѕР№
                const firstLine = lines[0];
                const delimiter = firstLine.includes(';') ? ';' : ',';
                
                // РџР°СЂСЃРёРј Р·Р°РіРѕР»РѕРІРєРё
                const headers = firstLine.split(delimiter).map(h => h.replace(/^"|"$/g, '').trim());
                
                const data = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    // РџСЂРѕСЃС‚РѕР№, РЅРѕ РЅР°РґС‘Р¶РЅС‹Р№ СЂР°Р·Р±РѕСЂ СЃ СѓС‡С‘С‚РѕРј РєР°РІС‹С‡РµРє
                    const values = [];
                    let current = '';
                    let inQuotes = false;
                    for (let j = 0; j < line.length; j++) {
                        const char = line[j];
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === delimiter && !inQuotes) {
                            values.push(current);
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    values.push(current);
                    
                    const cleanValues = values.map(v => v.replace(/^"|"$/g, '').trim());
                    if (cleanValues.length !== headers.length) continue;
                    
                    const obj = {};
                    headers.forEach((h, idx) => {
                        obj[h] = cleanValues[idx];
                    });
                    
                    // РџСЂРёРІРµРґРµРЅРёРµ С‚РёРїРѕРІ
                    obj.amount = parseFloat(obj.amount) || 0;
                    obj.periodCount = validCount(obj.periodCount || 1);
                    parseDate(obj.nextPayment);
                    obj.renewalAnchor = obj.renewalAnchor || obj.nextPayment;
                    parseDate(obj.renewalAnchor);
                    if (!['week','month','year'].includes(obj.period) || obj.renewalAnchor > obj.nextPayment) throw new Error('РќРµРєРѕСЂСЂРµРєС‚РЅР°СЏ РїРѕРґРїРёСЃРєР°');
                    // Р•СЃР»Рё id РЅРµС‚ вЂ” СЃРіРµРЅРµСЂРёСЂСѓРµРј
                    if (!obj.id) obj.id = Date.now().toString(36) + Math.random().toString(36).substr(2,6);
                    data.push(obj);
                }
                return data;
            }

            window.exportData = function() {
                const headers = ['id', 'name', 'amount', 'period', 'periodCount', 'nextPayment', 'renewalAnchor'];
                const rows = subscriptions.map(sub => [
                    sub.id,
                    sub.name,
                    sub.amount,
                    sub.period,
                    sub.periodCount || 1,
                    sub.nextPayment,
                    sub.renewalAnchor || sub.nextPayment
                ]);
                const csvContent = [headers, ...rows].map(row => 
                    row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
                ).join('\n');
                const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                const url = URL.createObjectURL(blob);
                link.href = url;
                link.download = `subscriptions_${todayDate()}.csv`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                closeMenuModal();
            };

            window.triggerImport = function() {
                document.getElementById('importFileInput').click();
                closeMenuModal();
            };

            document.getElementById('importFileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const imported = parseCSV(ev.target.result);
                        if (imported.length === 0) {
                            alert('Р¤Р°Р№Р» РЅРµ СЃРѕРґРµСЂР¶РёС‚ РґР°РЅРЅС‹С… РёР»Рё РёРјРµРµС‚ РЅРµРІРµСЂРЅС‹Р№ С„РѕСЂРјР°С‚.');
                            return;
                        }
                        if (confirm(`Р—Р°РјРµРЅРёС‚СЊ С‚РµРєСѓС‰РёРµ РїРѕРґРїРёСЃРєРё (${subscriptions.length}) РЅР° ${imported.length} РёР· С„Р°Р№Р»Р°?`)) {
                            subscriptions = imported;
                            saveToStorage();
                            renderCards();
                        }
                    } catch (err) {
                        alert('РћС€РёР±РєР° РїСЂРё С‡С‚РµРЅРёРё С„Р°Р№Р»Р°.');
                        console.error(err);
                    }
                    e.target.value = '';
                };
                reader.readAsText(file, 'UTF-8');
            });

            // ---------- РњРѕРґР°Р»РєРё ----------
            window.openMenuModal = () => document.getElementById('menuModal').classList.add('active');
            window.closeMenuModal = () => document.getElementById('menuModal').classList.remove('active');

            window.openModal = function(id = null) {
                editingId = id;
                const modal = document.getElementById('modal');
                const title = document.getElementById('modal-title');
                const form = document.getElementById('subscription-form');
                if (id) {
                    const sub = subscriptions.find(s => s.id === id);
                    if (sub) {
                        document.getElementById('name').value = sub.name;
                        document.getElementById('amount').value = sub.amount;
                        document.getElementById('period').value = sub.period;
                        document.getElementById('period-count').value = sub.periodCount || 1;
                        document.getElementById('next-payment').value = sub.nextPayment;
                        title.textContent = 'РР·РјРµРЅРёС‚СЊ РїРѕРґРїРёСЃРєСѓ';
                    }
                } else {
                    form.reset();
                    document.getElementById('period-count').value = 1;
                    const tomorrow = parseDate(todayDate()); tomorrow.setUTCDate(tomorrow.getUTCDate()+1);
                    document.getElementById('next-payment').value = formatDate(tomorrow);
                    title.textContent = 'РќРѕРІР°СЏ РїРѕРґРїРёСЃРєР°';
                }
                modal.classList.add('active');
            };

            window.closeModal = () => document.getElementById('modal').classList.remove('active');

            document.getElementById('subscription-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value.trim();
                const amount = parseFloat(document.getElementById('amount').value) || 0;
                const period = document.getElementById('period').value;
                const periodCount = Number(document.getElementById('period-count').value);
                const nextPayment = document.getElementById('next-payment').value;
                if (!name || !Number.isFinite(amount) || amount < 0) { alert('Р’РІРµРґРёС‚Рµ РЅР°Р·РІР°РЅРёРµ Рё РЅРµРѕС‚СЂРёС†Р°С‚РµР»СЊРЅСѓСЋ СЃС‚РѕРёРјРѕСЃС‚СЊ'); return; }
                try { validCount(periodCount); parseDate(nextPayment); } catch (error) { alert(error.message); return; }
                const previous = subscriptions.find(s => s.id === editingId);
                const renewalAnchor = previous && previous.nextPayment === nextPayment && previous.period === period && Number(previous.periodCount || 1) === periodCount
                    ? (previous.renewalAnchor || nextPayment) : nextPayment;
                const data = {
                    id: editingId || Date.now().toString(36) + Math.random().toString(36).substr(2,6),
                    name, amount, period, periodCount, nextPayment, renewalAnchor
                };
                if (editingId) {
                    const idx = subscriptions.findIndex(s => s.id === editingId);
                    if (idx !== -1) subscriptions[idx] = data;
                } else {
                    subscriptions.push(data);
                }
                saveToStorage();
                closeModal();
                renderCards();
            });

            window.editSubscription = (id) => openModal(id);
            window.deleteSubscription = (id) => {
                if (confirm('РЈРґР°Р»РёС‚СЊ РїРѕРґРїРёСЃРєСѓ?')) {
                    subscriptions = subscriptions.filter(s => s.id !== id);
                    saveToStorage();
                    renderCards();
                }
            };

            // Service Worker
            if ('serviceWorker' in navigator) {
                const swCode = `const CACHE='subs-v6';self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./'])))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))});`;
                const blob = new Blob([swCode], {type:'application/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
            }

            renderCards();
            setInterval(renderCards, 60000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) renderCards(); });
        })();
    </script>
</body>
</html>
